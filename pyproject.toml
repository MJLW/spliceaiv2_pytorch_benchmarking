[project]
name = "spliceai2-bench"
version = "0.1.0"
description = "GPU runtime benchmark for SpliceAI2 inference (FP16 autocast + torch.compile)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.21",
    "huggingface_hub>=0.20",
    "nvidia-ml-py>=12",  # GPU temperature / clock / power logging
]

[project.scripts]
spliceai2-bench = "spliceai2_bench.benchmark:main"
spliceai2-mutbench = "spliceai2_bench.mutation_benchmark:main"
spliceai2-suite = "spliceai2_bench.suite:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
